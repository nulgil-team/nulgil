plugins { id 'com.android.application' version '8.7.3' }

// Release signing reads a properties file kept OUTSIDE the repository (storeFile, alias, password).
// Pass its path with -Pnulgil.signing=<path> or the NULGIL_SIGNING environment variable.
// Without it, assembleRelease produces an unsigned APK. Never commit the key or the properties file.
def signingPath = project.findProperty('nulgil.signing') ?: System.getenv('NULGIL_SIGNING')
def signing = new Properties()
if (signingPath && file(signingPath).isFile()) file(signingPath).withInputStream { signing.load(it) }
def canSign = signing.getProperty('storeFile') && signing.getProperty('alias') && signing.getProperty('password')

android {
    namespace 'kr.routine.app'
    compileSdk 35
    useLibrary 'android.car'
    defaultConfig {
        applicationId 'kr.routine.app'
        minSdk 34
        targetSdk 34
        versionCode 3
        versionName '0.3-stops'
    }
    signingConfigs {
        if (canSign) {
            release {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('password')
                keyAlias signing.getProperty('alias')
                keyPassword signing.getProperty('password')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (canSign) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java.srcDir '../core/src/main/java'
}
dependencies { implementation 'ai.pleos.playground:NaviHelper:3.0.5' }
